# Local Development Docker Compose
# Builds everything from source using Dockerfile
services:
  ytdownloader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ytdownloader-dev
    ports:
      - "8000:8080"
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - BGUTIL_BASE_URL=http://bgutil-provider:4416
    volumes:
      - ./downloads:/app/downloads
      # Cookies fuer altersbeschraenkte Videos: erst eine echte cookies.txt
      # im Projektverzeichnis anlegen (siehe .env.example), dann die naechste
      # Zeile aktivieren. Fehlt die Datei, legt Docker beim Mount ein
      # Verzeichnis an und die Cookies werden ignoriert.
      # - ./cookies.txt:/app/cookies.txt:ro
    depends_on:
      - bgutil-provider
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: bgutil-provider-dev
    restart: unless-stopped